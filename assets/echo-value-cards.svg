<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Echo 的核心价值</title>
  <desc id="desc">更快找回、更少打扰、更长期陪伴</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101823"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2230"/>
      <stop offset="1" stop-color="#151b26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="498" rx="23" fill="none" stroke="#273244"/>

  <text x="52" y="61" fill="#4aa8ff" font-family="SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="2.5">WHY ECHO</text>
  <text x="52" y="112" fill="#f2f5fa" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="34" font-weight="700">一个更轻、更懂你的剪贴板</text>
  <text x="52" y="148" fill="#8e9bad" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="16">把复制过的内容留在手边，把复杂的设置留在身后。</text>

  <g filter="url(#shadow)">
    <rect x="42" y="196" width="350" height="248" rx="14" fill="url(#card)" stroke="#2d3b4e"/>
    <rect x="425" y="196" width="350" height="248" rx="14" fill="url(#card)" stroke="#2d3b4e"/>
    <rect x="808" y="196" width="350" height="248" rx="14" fill="url(#card)" stroke="#2d3b4e"/>
  </g>

  <g>
    <circle cx="82" cy="240" r="21" fill="#173653" stroke="#4aa8ff"/>
    <text x="82" y="247" text-anchor="middle" fill="#75c2ff" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">01</text>
    <text x="120" y="238" fill="#4aa8ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="700">更快找回</text>
    <text x="64" y="300" fill="#f2f5fa" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="24" font-weight="700">一眼找到，马上粘贴</text>
    <text x="64" y="338" fill="#a7b2c1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15">自动收录文本、图片和文件</text>
    <text x="64" y="366" fill="#a7b2c1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15">快速定位，不打断当前工作</text>
    <path d="M64 402H164" stroke="#4aa8ff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="465" cy="240" r="21" fill="#173b35" stroke="#34d399"/>
    <text x="465" y="247" text-anchor="middle" fill="#71e8bc" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">02</text>
    <text x="503" y="238" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="700">更少打扰</text>
    <text x="447" y="300" fill="#f2f5fa" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="24" font-weight="700">本地运行，安静可靠</text>
    <text x="447" y="338" fill="#a7b2c1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15">历史数据不写入云端</text>
    <text x="447" y="366" fill="#a7b2c1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15">不需要复杂权限和配置</text>
    <path d="M447 402H547" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="848" cy="240" r="21" fill="#332b4e" stroke="#a78bfa"/>
    <text x="848" y="247" text-anchor="middle" fill="#c5b4ff" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">03</text>
    <text x="886" y="238" fill="#a78bfa" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" font-weight="700">更长期陪伴</text>
    <text x="830" y="300" fill="#f2f5fa" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="24" font-weight="700">用得越久，越有回声</text>
    <text x="830" y="338" fill="#a7b2c1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15">使用成就记录你的工作习惯</text>
    <text x="830" y="366" fill="#a7b2c1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif" font-size="15">轻量反馈，不制造压力</text>
    <path d="M830 402H930" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
